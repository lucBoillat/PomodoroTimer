@if (editing()) {
  <form class="edit" [formRoot]="editForm" (keydown.escape)="cancelEditing()">
    <mat-form-field subscriptSizing="dynamic">
      <mat-label>Titel</mat-label>
      <input matInput [formField]="editForm.title" />
      @for (error of editForm.title().errors(); track $index) {
        <mat-error>{{ error.message }}</mat-error>
      }
    </mat-form-field>
    <button mat-icon-button type="submit" aria-label="Speichern" matTooltip="Speichern">
      <mat-icon>check</mat-icon>
    </button>
    <button
      mat-icon-button
      type="button"
      aria-label="Abbrechen"
      matTooltip="Abbrechen"
      (click)="cancelEditing()"
    >
      <mat-icon>close</mat-icon>
    </button>
  </form>
} @else {
  <span class="title">{{ task().title }}</span>
  <span class="status" [attr.data-status]="task().state.status">{{ statusLabel() }}</span>

  <span class="actions">
    @if (task().isPending()) {
      <span [matTooltip]="startBlocked() ?? 'Starten'">
        <button
          mat-icon-button
          type="button"
          aria-label="Starten"
          [disabled]="startBlocked() !== null"
          (click)="start.emit()"
        >
          <mat-icon>play_arrow</mat-icon>
        </button>
      </span>
      <button
        mat-icon-button
        type="button"
        aria-label="Als erledigt markieren"
        matTooltip="Als erledigt markieren"
        (click)="complete.emit()"
      >
        <mat-icon>check</mat-icon>
      </button>
    }
    @if (task().canEdit()) {
      <button
        mat-icon-button
        type="button"
        aria-label="Bearbeiten"
        matTooltip="Bearbeiten"
        (click)="startEditing()"
      >
        <mat-icon>edit</mat-icon>
      </button>
    }
    @if (task().canDelete()) {
      <button
        mat-icon-button
        type="button"
        aria-label="Löschen"
        matTooltip="Löschen"
        (click)="remove.emit()"
      >
        <mat-icon>delete</mat-icon>
      </button>
    }
  </span>
}
