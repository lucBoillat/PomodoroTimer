<form [formRoot]="taskForm">
  <mat-form-field>
    <mat-label>Neue Aufgabe</mat-label>
    <input matInput type="text" [formField]="taskForm.title" />
    <mat-hint align="end">{{ taskForm.title().value().length }} / {{ maxLength }}</mat-hint>
    @for (error of taskForm.title().errors(); track $index) {
      <mat-error>{{ error.message }}</mat-error>
    }
  </mat-form-field>

  <button mat-flat-button type="submit">Hinzufügen</button>
</form>
