<app-current-panel
  [task]="taskStore.activeTask()"
  [activeBreak]="breakStore.currentBreak()"
  [now]="clock.now()"
  (pauseTask)="pauseActive()"
  (resumeTask)="resumeActive()"
  (complete)="completeActive()"
  (endBreak)="breakStore.end()"
/>
<app-task-form (added)="taskStore.add($event)" />
@for (task of taskStore.tasks(); track task.id) {
  <app-task-item
    [task]="task"
    [startBlocked]="startBlocked()"
    (start)="taskStore.start(task.id)"
    (complete)="taskStore.complete(task.id)"
    (remove)="taskStore.delete(task.id)"
    (rename)="taskStore.edit(task.id, $event)"
  />
} @empty {
  <p>Noch keine Aufgaben.</p>
}

<div class="page-actions">
  <button mat-stroked-button type="button" (click)="taskStore.loadSamples()">
    <mat-icon>dataset</mat-icon>
    Beispieldaten laden
  </button>
  <button mat-button type="button" class="danger" (click)="resetAll()">
    <mat-icon>restart_alt</mat-icon>
    Alles zurücksetzen
  </button>
</div>
