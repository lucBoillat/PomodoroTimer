<header class="app-header">
  <div class="container">
    <h1 class="app-title">
      <mat-icon aria-hidden="true">timer</mat-icon>
      Pomodoro
    </h1>
  </div>
  <nav mat-tab-nav-bar class="container" [tabPanel]="tabPanel">
    @for (link of links; track link.path) {
      <a
        mat-tab-link
        [routerLink]="link.path"
        routerLinkActive
        #rla="routerLinkActive"
        [active]="rla.isActive"
      >
        {{ link.label }}
      </a>
    }
  </nav>
</header>

<mat-tab-nav-panel #tabPanel>
  <main class="container content">
    <router-outlet />
  </main>
</mat-tab-nav-panel>
